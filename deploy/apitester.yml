services:

  apitester:
    image: pwarnon/apitester:latest
    container_name: apitester
    ports:
      # Lié à 127.0.0.1 : le proxy dynamique (/__proxy/…) relaie vers n'importe
      # quelle cible et ne doit pas être utilisable depuis le reste du réseau.
      - "127.0.0.1:4200:80"
    extra_hosts:
      # « localhost » saisi dans l'app est relayé vers le poste hôte
      # (déjà fourni par Docker Desktop sur Mac/Windows, nécessaire sous Linux).
      - "host.docker.internal:host-gateway"
    volumes:
      # Optionnel : alias de proxy déclarés (le proxy dynamique n'en a pas besoin).
      # Format : { "/prefix": { "target": "http://host:port", "secure": false } }
      # Modèle : https://github.com/warnonphilippe/apitester/blob/master/proxy.config.example.json
      - ./proxy.config.json:/etc/nginx/proxy.config.json:ro
    restart: unless-stopped

  echo-server:
    image: pwarnon/apitester-echo:latest
    container_name: apitester-echo
    ports:
      - "8888:8888"
    restart: unless-stopped

# ─── Utilisation ────────────────────────────────────────────────────────────
#
#  1. Copier ce fichier sur n'importe quel Mac / PC avec Docker installé.
#
#  2. Pour un serveur sans en-têtes CORS : cocher « Via proxy » dans l'app,
#     aucune configuration requise.
#     Optionnel — alias courts dans un proxy.config.json du même répertoire :
#       {
#         "/proxy": { "target": "http://mon-api:8080", "secure": false }
#       }
#
#  3. Démarrer :
#       docker compose -f apitester.yml up -d
#
#  4. Ouvrir http://localhost:4200
#
#  5. Arrêter :
#       docker compose -f apitester.yml down
#
#  6. Mettre à jour vers la dernière version :
#       docker compose -f apitester.yml pull
#       docker compose -f apitester.yml up -d
